name: Catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify catalog and producer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Use self-contained data until approved public catalog data is committed.
      - name: Check catalog CLI fixture
        run: make check-catalog CATALOG_ROOT=dotagents/__fixtures__/valid-project

      - name: Run catalog tests
        run: make test-catalog

      - name: Run producer checks
        run: make check

      - name: Run producer tests
        run: make test
